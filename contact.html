<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Skip the Stuff</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Dynamic Header Container -->
  <header id="site-header"></header>

  <main>
    <!-- Full-Width Hero Banner -->
    <section class="hero">
      <h1>Get in Touch 📩</h1>
      <p>Have questions, ideas, or feedback? Reach out to our team or get involved in our grassroots movement.</p>
    </section>

    <!-- Body Content Wrapper -->
    <div class="container">
      
      <!-- Contact Form Card -->
      <section class="form-card" style="max-width: 650px; margin: 2rem auto 0;">
        <h2>Send Us a Message</h2>
        <p style="margin-bottom: 1.5rem; color: var(--text);">Fill out the form below and a member of our team will get back to you soon.</p>

        <form action="https://api.web3forms.com/submit" method="POST">
          <!-- Web3Forms Access Key & Configuration -->
          <input type="hidden" name="access_key" value="62c086ce-9a2c-4ab1-a22f-5c4904999a47">
          <input type="hidden" name="redirect" value="https://skipthestuff.org/thanks.html">
          <input type="hidden" name="subject" value="New Contact Form Submission - Skip the Stuff">
          <input type="hidden" name="from_name" value="Skip the Stuff Contact Form">
          <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

          <!-- Visible Form Inputs -->
          <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" required placeholder="First and Last Name"">
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="name@example.com">
          </div>

          <div class="form-group">
            <label for="subject">Subject</label>
            <select id="subject" name="subject_category" required>
              <option value="" disabled selected>Select an option...</option>
              <option value="general">General Inquiry</option>
              <option value="volunteering">Volunteering Opportunities</option>
              <option value="restaurant">Restaurant Question / Support</option>
              <option value="press">Press & Media</option>
            </select>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required placeholder="How can we help?" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; font-family: inherit;"></textarea>
          </div>

          <button type="submit" class="btn" style="width: 100%;">Send Message 🌱</button>
        </form>
      </section>

    </div>
  </main>

  <!-- Dynamic Footer Container -->
  <footer id="site-footer"></footer>

  <!-- Header & Footer Loader Script -->
  <script>
    fetch('./header.html')
      .then(res => res.text())
      .then(data => document.getElementById('site-header').innerHTML = data);

    fetch('./footer.html')
      .then(res => res.text())
      .then(data => document.getElementById('site-footer').innerHTML = data);
  </script>

</body>
</html>
